name: Deploy to GitHub Pages

on:
  # Run after Release, not on push: Release commits the version bump with
  # [skip ci], so a push-triggered build would ship the previous version badge.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: ["main"]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Minimum permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-progress deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: main picks up the bump commit, which is newer than the triggering SHA.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # Injects basePath and disables image optimization for static export
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      # Cache .next/cache between runs; busts on lockfile or source changes
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx --no-install next build

      # Uploads ./out as the Pages artifact for the deploy job
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
